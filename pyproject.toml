[project]
name = "support-bot"
version = "0.1.0"
description = "A support chatbot that answers from your own documents, cites its sources, and hands over to a human when it should."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "openai>=1.40",
    "fastembed>=0.3",
    "rank-bm25>=0.2.2",
    "pypdf>=4.3",
    "httpx>=0.27",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "markdown>=3.6"]

[project.scripts]
support-bot-ingest = "app.ingest:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
